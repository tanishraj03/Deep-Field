name: Deep Field — Daily Brief

# Runs on GitHub's free minutes. Standard ubuntu-latest runner only —
# never a larger paid runner. Total usage is a handful of minutes a month.
on:
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30.
    - cron: "30 0 * * *"   # 06:00 IST — collect
    - cron: "30 1 * * *"   # 07:00 IST — analyse + score
    - cron: "0  2 * * *"   # 07:30 IST — write the brief
    # Delivery is checked every hour on the half hour (= :00 IST) and the app
    # sends only at the hour set in Settings. That is what makes the briefing
    # time changeable from the interface rather than by editing this file.
    # A run that is not due exits in about a second without collecting.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        default: "full"
        type: choice
        options: [collect, analyse, brief, deliver, full]

concurrency:
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Twenty analyse passes at roughly a minute each. Public repositories get
    # unlimited Actions minutes, and the job still exits as soon as the app
    # says there is nothing left to interpret.
    timeout-minutes: 25
    steps:
      - name: Decide stage
        id: stage
        run: |
          CRON="${{ github.event.schedule }}"
          MANUAL="${{ inputs.stage }}"
          if [ -n "$MANUAL" ]; then
            echo "stage=$MANUAL" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "30 0 * * *" ]; then echo "stage=collect"  >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "30 1 * * *" ]; then echo "stage=analyse"  >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "0 2 * * *"  ]; then echo "stage=brief"    >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "30 * * * *" ]; then echo "stage=deliver-if-due" >> "$GITHUB_OUTPUT"
          else echo "stage=deliver" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the pipeline
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

          # One job per stage. Collecting, interpreting, writing and posting
          # cannot share a single 60s Hobby function — that returned 504.
          case "$STAGE" in
            collect)  QS="?stage=collect" ;;
            analyse)  QS="?stage=analyse" ;;
            brief)    QS="?stage=brief" ;;
            deliver)  QS="?stage=deliver" ;;
            deliver-if-due) QS="?stage=deliver&scheduled=1" ;;
            full)     QS="?brief=1&slack=1" ;;
            *)        QS="?stage=collect" ;;
          esac

          echo "Stage: $STAGE → POST ${APP_URL}/api/ingest${QS}"

          call() {
            curl -sS -o response.json -w "%{http_code}" \
              -X POST "${APP_URL}/api/ingest${QS}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 120 --retry 2 --retry-delay 20 --retry-connrefused
          }

          HTTP=$(call)
          echo "HTTP $HTTP"
          cat response.json

          # One analyse pass fits about ten paced model calls inside the
          # function timeout, so keep going while items remain unanalysed.
          # Runs here, not on Vercel, because GitHub gives us the minutes.
          # One pass fits roughly ten paced model calls inside the Vercel
          # function timeout, so a full morning needs several. The app tells us
          # whether another pass is worth making: `moreToDo` is false when the
          # provider refused, true when we merely ran out of clock. Reading
          # aiSkipped instead — which is set in BOTH cases — stopped the loop
          # after one pass and left most of the day uninterpreted.
          if [ "$STAGE" = "analyse" ] && [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            for pass in $(seq 2 20); do
              MORE=$(python3 -c "import json;print(json.load(open('response.json')).get('moreToDo',False))" 2>/dev/null || echo False)
              REMAINING=$(python3 -c "import json;print(json.load(open('response.json')).get('remaining',0))" 2>/dev/null || echo 0)
              echo "after pass $((pass-1)): ${REMAINING} unanalysed, moreToDo=${MORE}"
              [ "$MORE" != "True" ] && echo "stopping: nothing further this pass can do" && break
              sleep 15
              HTTP=$(call)
              echo "pass $pass → HTTP $HTTP"
              cat response.json
              [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ] && echo "stopping: HTTP $HTTP" && break
            done
          fi

          # A failed source is normal and must not fail the workflow.
          # Only a non-2xx response from our own app is a real failure.
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Ingestion endpoint returned $HTTP"
            exit 1
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Daily Intelligence — ${{ steps.stage.outputs.stage }}"
            echo ""
            if [ -f response.json ]; then
              echo '```json'
              cat response.json
              echo '```'
            else
              echo "No response captured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
