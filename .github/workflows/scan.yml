name: Deep Field — Scan

# Re-reads every niche four times a day so Pulse is fresh when you open it.
# It calls the deployed app one niche per request (each fits inside a
# serverless time limit; the whole catalogue does not). Standard runner only.
on:
  schedule:
    - cron: "15 0,6,12,18 * * *"   # 05:45, 11:45, 17:45, 23:45 IST
  workflow_dispatch:
    inputs:
      niches:
        description: "Comma-separated niche ids (blank = all)"
        required: false
        default: ""

concurrency:
  group: deep-field-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ inputs.niches }}
        run: |
          set -uo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Add the APP_URL secret (Settings → Secrets → Actions)."; exit 1
          fi
          AUTH="Authorization: Bearer ${CRON_SECRET}"

          if [ -n "${ONLY:-}" ]; then
            NICHES=$(echo "$ONLY" | tr ',' ' ')
          else
            NICHES=$(curl -sf "${APP_URL}/api/scan" | python3 -c "import json,sys;print(' '.join(n['id'] for n in json.load(sys.stdin)['niches']))")
          fi

          echo "### Deep Field scan" >> "$GITHUB_STEP_SUMMARY"
          FAILED=0
          for N in signals $NICHES; do
            if [ "$N" = "signals" ]; then Q="signals=1"; else Q="niche=$N"; fi
            HTTP=$(curl -s -o out.json -w "%{http_code}" -X POST "${APP_URL}/api/scan?${Q}" -H "$AUTH" --max-time 290)
            LINE=$(python3 -c "import json;d=json.load(open('out.json'));print(d.get('topics', d.get('signals','')), d.get('model') or '', d.get('aiNote') or d.get('error') or '')" 2>/dev/null || echo "")
            echo "- \`$N\` → HTTP $HTTP $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || FAILED=$((FAILED+1))
            sleep 5
          done
          # One niche failing is normal (a source was down); all failing is not.
          [ "$FAILED" -lt 5 ]
