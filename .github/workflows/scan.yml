name: DeepField daily scan

# A backup for Vercel Cron (vercel.json). Wakes every hour (GitHub often runs
# it hours late) and asks the app to start today's scan; the app starts it
# once a day, at the first call at or after the hour set in the admin
# dashboard (default 9:00 AM IST), and runs it on the server itself. Run by
# hand, it always scans: everything, or just the niches you name.
on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07 (off the busy top of the hour)
  workflow_dispatch:
    inputs:
      niches:
        description: "Comma-separated niche ids (blank = all)"
        required: false
        default: ""

concurrency:
  group: deepfield-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ inputs.niches }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Add the APP_URL secret (Settings → Secrets → Actions)."; exit 1
          fi
          APP_URL="${APP_URL%/}"
          AUTH="Authorization: Bearer ${CRON_SECRET}"

          # Usual case: ask the app to start today's scan. It runs on the server,
          # one niche per request, so this step finishes in seconds. Vercel Cron
          # calls the same endpoint; whichever comes first after the set hour wins.
          if [ -z "${ONLY:-}" ]; then
            FORCE=""; [ "$EVENT" = "workflow_dispatch" ] && FORCE="?force=1"
            RES=$(curl -s "${APP_URL}/api/cron/daily${FORCE}" -H "$AUTH" --max-time 60)
            echo "Daily scan: $RES" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$RES" | python3 -c "import json,sys;sys.exit(0 if json.load(sys.stdin).get('ok') else 1)"
            exit $?
          fi

          # Run by hand for named niches: scan just those, here, one at a time.
          NICHES=$(echo "$ONLY" | tr ',' ' ')
          echo "### DeepField scan" >> "$GITHUB_STEP_SUMMARY"
          FAILED=0
          for N in $NICHES; do
            HTTP=$(curl -s -o out.json -w "%{http_code}" -X POST "${APP_URL}/api/scan?niche=$N" -H "$AUTH" --max-time 295)
            LINE=$(python3 -c "import json;d=json.load(open('out.json'));print(d.get('detail') or d.get('error') or '')" 2>/dev/null || echo "")
            echo "- \`$N\` → HTTP $HTTP $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || FAILED=$((FAILED+1))
            sleep 3
          done
          # One niche failing is normal (a source was down); many failing is not.
          [ "$FAILED" -lt 5 ]
